apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "devops-task-platform.fullname" . }}
  labels:
    {{- include "devops-task-platform.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "devops-task-platform.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "devops-task-platform.labels" . | nindent 8 }}

    spec:
      containers:
        - name: task-api

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.port }}

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}