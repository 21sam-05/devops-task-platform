apiVersion: v1
kind: Service

metadata:
  name: {{ include "devops-task-platform.fullname" . }}
  labels:
    {{- include "devops-task-platform.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

  selector:
    {{- include "devops-task-platform.selectorLabels" . | nindent 4 }}

